
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f7fc">
  <title>LinkUp - Messenger</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="login-screen" class="login-screen">
    <div class="login-card">
      <div class="logo">L</div>
      <h1>LinkUp</h1>
      <p class="subtitle">Connect with your people.</p>
      <p class="muted">친구들과 편하게 이야기를 나눠 보세요.</p>
      <button id="google-login-btn" class="google-btn">
        <span class="google-letter">G</span>
        Google로 로그인
      </button>
      <p id="login-error" class="error"></p>
    </div>
  </div>

  <div id="app-screen" class="hidden">
    <header class="topbar">
      <a class="brand" href="./"> <span class="brand-logo">L</span> LinkUp </a>
      <div class="account">
        <img id="user-photo" class="avatar" alt="프로필 사진">
        <span id="user-name">사용자</span>
        <button id="logout-btn" class="logout-btn">로그아웃</button>
      </div>
    </header>

    <main class="layout">
      <aside class="sidebar">
        <h2>메신저</h2>

        <div class="tabs">
          <button id="friends-tab" class="tab active">친구</button>
          <button id="requests-tab" class="tab">
            친구 요청 <span id="request-count"></span>
          </button>
        </div>

        <form id="search-form" class="search-form">
          <input id="search-input" type="email"
            placeholder="친구 이메일 검색" autocomplete="off" required>
          <button type="submit" aria-label="검색">⌕</button>
        </form>

        <div id="search-results" class="search-results"></div>

        <section id="friends-panel">
          <h3>내 친구</h3>
          <div id="friends-list">
            <p class="muted">친구 목록을 불러오는 중...</p>
          </div>
        </section>

        <section id="requests-panel" class="hidden">
          <h3>받은 친구 요청</h3>
          <div id="requests-list"></div>
        </section>
      </aside>

      <section class="chat-area">
        <div id="welcome-panel" class="welcome">
          <div class="welcome-symbol">✦</div>
          <h2>LinkUp에 오신 걸 환영해요!</h2>
          <p>친구를 선택하면 대화를 시작할 수 있어요.</p>
        </div>

        <section id="room-panel" class="room hidden">
          <header class="room-header">
            <img id="room-photo" class="avatar" alt="친구 프로필">
            <div>
              <h2 id="room-title">친구</h2>
              <p class="muted">1:1 채팅</p>
            </div>
          </header>

          <div id="messages-list" class="messages"></div>

          <form id="message-form" class="message-form">
            <input id="message-input" maxlength="2000"
              placeholder="메시지를 입력하세요..." autocomplete="off" required>
            <button id="send-btn" type="submit">전송</button>
          </form>
          <p id="message-error" class="error message-error"></p>
        </section>
      </section>
    </main>
  </div>

  <script type="module" src="./auth.js"></script>
</body>
</html>
